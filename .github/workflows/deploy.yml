name: Build website release artifact

on:
  push:
    branches: [main]
  workflow_dispatch:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Production is an atomic, manually verified release on Garfield.
      # See docs/design-system.md; the old FTP target is not the live source.
      - name: Save complete site for verified manual deployment
        uses: actions/upload-artifact@v4
        with:
          name: william64-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
