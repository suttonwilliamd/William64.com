name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Trigger Server Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"%s","sha":"%s","repo":"%s"}' "$DEPLOY_REF" "$DEPLOY_SHA" "$DEPLOY_REPO")
          # Prefer the origin directly; HTTPS may be Cloudflare-proxied and challenge CI.
          for scheme in http https; do
            echo "Trying deploy endpoint over $scheme"
            if curl --fail-with-body --max-time 30 -X POST "${scheme}://${DEPLOY_HOST}/api/deploy" \
              -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload"; then
              exit 0
            fi
          done
          exit 1
